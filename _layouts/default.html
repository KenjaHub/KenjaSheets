<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <link rel="canonical" href="https://kenjahub.github.io/KenjaSheets{{ page.url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.png' | relative_url }}" alt="Kenja Sheets icon">Kenja Sheets</a>
    <a class="cta small" href="https://apps.apple.com/app/kenja-sheets/idPLACEHOLDER">Download on the Mac App Store</a>
  </header>

  <main class="article">
    {{ content }}
  </main>

  <footer>
    <p>© 2026 Kenja.</p>
    <p><a href="{{ '/' | relative_url }}">Home</a></p>
  </footer>
</body>
</html>
